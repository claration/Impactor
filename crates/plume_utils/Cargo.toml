[package]
name = "plume_utils"
description = "Utility functions and types for Impactor tools."
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
idevice.workspace = true
thiserror.workspace = true
uuid.workspace = true
plist.workspace = true
tokio.workspace = true
futures.workspace = true
log.workspace = true
image.workspace = true
goblin.workspace = true
zip.workspace = true
flate2.workspace = true
plume_core = { path = "../plume_core", features = ["tweaks"] }
plume_store = { path = "../plume_store" }
decompress = { path = "../../3rdparty/decompress" }

# mDNS discovery for Apple TV network scanning
mdns-sd = "0.11"

[dev-dependencies]
env_logger.workspace = true

# Native DNS-SD via the Windows resolver (dnsapi.dll). The raw-socket mdns-sd backend does
# not receive multicast responses on Windows; the OS resolver does.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
    "Win32_NetworkManagement_Dns",
    "Win32_Foundation",
] }
